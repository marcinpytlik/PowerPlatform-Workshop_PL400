openapi: 3.0.3
info:
  title: Vendor Contract Mock API
  version: 1.0.0
paths:
  /api/contracts:
    post:
      summary: Register approved contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractNumber, supplierCode, amount, currency]
              properties:
                contractNumber:
                  type: string
                supplierCode:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                correlationId:
                  type: string
      responses:
        '201':
          description: Contract registered
        '400':
          description: Invalid request
        '409':
          description: Contract already exists
        '429':
          description: Too many requests
        '500':
          description: Server error
